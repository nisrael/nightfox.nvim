# Nightfox Carbonfox colors for the ly display manager
# name: carbonfox
# upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/carbonfox/ly.ini
#
# ly keeps its whole config in one file. Copy the keys below into
# /etc/ly/config.ini, replacing the matching lines.

# Login box
fg = 0x00F2F4F8
bg = 0x00161616
border_fg = 0x00535353

# Errors (bold, matching ly's default styling)
error_fg = 0x01EE5396
error_bg = 0x00161616

# Background-animation colors (only used when `animation` is set)
cmatrix_fg = 0x0025BE6A
cmatrix_head_col = 0x0146C880
gameoflife_fg = 0x0025BE6A
colormix_col1 = 0x0078A9FF
colormix_col2 = 0x00BE95FF
colormix_col3 = 0x000C0C0C
doom_top_color = 0x00EE5396
doom_middle_color = 0x0008BDBA
doom_bottom_color = 0x00DFDFE0
