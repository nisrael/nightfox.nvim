# Nightfox Nordfox colors for the ly display manager
# name: nordfox
# upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/nordfox/ly.ini
#
# ly keeps its whole config in one file. Copy the keys below into
# /etc/ly/config.ini, replacing the matching lines.

# Login box
fg = 0x00CDCECF
bg = 0x002E3440
border_fg = 0x005A657D

# Errors (bold, matching ly's default styling)
error_fg = 0x01BF616A
error_bg = 0x002E3440

# Background-animation colors (only used when `animation` is set)
cmatrix_fg = 0x00A3BE8C
cmatrix_head_col = 0x01B1D196
gameoflife_fg = 0x00A3BE8C
colormix_col1 = 0x0081A1C1
colormix_col2 = 0x00B48EAD
colormix_col3 = 0x00232831
doom_top_color = 0x00BF616A
doom_middle_color = 0x00EBCB8B
doom_bottom_color = 0x00E5E9F0
