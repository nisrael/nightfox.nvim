# Nightfox Duskfox colors for the ly display manager
# name: duskfox
# upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/duskfox/ly.ini
#
# ly keeps its whole config in one file. Copy the keys below into
# /etc/ly/config.ini, replacing the matching lines.

# Login box
fg = 0x00E0DEF4
bg = 0x00232136
border_fg = 0x004B4673

# Errors (bold, matching ly's default styling)
error_fg = 0x01EB6F92
error_bg = 0x00232136

# Background-animation colors (only used when `animation` is set)
cmatrix_fg = 0x00A3BE8C
cmatrix_head_col = 0x01B1D196
gameoflife_fg = 0x00A3BE8C
colormix_col1 = 0x00569FBA
colormix_col2 = 0x00C4A7E7
colormix_col3 = 0x00191726
doom_top_color = 0x00EB6F92
doom_middle_color = 0x00F6C177
doom_bottom_color = 0x00E0DEF4
