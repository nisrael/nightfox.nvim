# Nightfox colors for the ly display manager
# name: nightfox
# upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/nightfox/ly.ini
#
# ly keeps its whole config in one file. Copy the keys below into
# /etc/ly/config.ini, replacing the matching lines.

# Login box
fg = 0x00CDCECF
bg = 0x00192330
border_fg = 0x0039506D

# Errors (bold, matching ly's default styling)
error_fg = 0x01C94F6D
error_bg = 0x00192330

# Background-animation colors (only used when `animation` is set)
cmatrix_fg = 0x0081B29A
cmatrix_head_col = 0x018EBAA4
gameoflife_fg = 0x0081B29A
colormix_col1 = 0x00719CD6
colormix_col2 = 0x009D79D6
colormix_col3 = 0x00131A24
doom_top_color = 0x00C94F6D
doom_middle_color = 0x00DBC074
doom_bottom_color = 0x00DFDFE0
