# Nightfox Dayfox colors for the ly display manager
# name: dayfox
# upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/dayfox/ly.ini
#
# ly keeps its whole config in one file. Copy the keys below into
# /etc/ly/config.ini, replacing the matching lines.

# Login box
fg = 0x003D2B5A
bg = 0x00F6F2EE
border_fg = 0x00AAB0AD

# Errors (bold, matching ly's default styling)
error_fg = 0x01A5222F
error_bg = 0x00F6F2EE

# Background-animation colors (only used when `animation` is set)
cmatrix_fg = 0x00396847
cmatrix_head_col = 0x01577F63
gameoflife_fg = 0x00396847
colormix_col1 = 0x002848A9
colormix_col2 = 0x006E33CE
colormix_col3 = 0x00E4DCD4
doom_top_color = 0x00A5222F
doom_middle_color = 0x00AC5402
doom_bottom_color = 0x00F2E9E1
