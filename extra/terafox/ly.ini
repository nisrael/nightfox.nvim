# Nightfox Terafox colors for the ly display manager
# name: terafox
# upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/terafox/ly.ini
#
# ly keeps its whole config in one file. Copy the keys below into
# /etc/ly/config.ini, replacing the matching lines.

# Login box
fg = 0x00E6EAEA
bg = 0x00152528
border_fg = 0x002D4F56

# Errors (bold, matching ly's default styling)
error_fg = 0x01E85C51
error_bg = 0x00152528

# Background-animation colors (only used when `animation` is set)
cmatrix_fg = 0x007AA4A1
cmatrix_head_col = 0x018EB2AF
gameoflife_fg = 0x007AA4A1
colormix_col1 = 0x005A93AA
colormix_col2 = 0x00AD5C7C
colormix_col3 = 0x000F1C1E
doom_top_color = 0x00E85C51
doom_middle_color = 0x00FDA47F
doom_bottom_color = 0x00EBEBEB
