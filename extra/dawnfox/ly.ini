# Nightfox Dawnfox colors for the ly display manager
# name: dawnfox
# upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/dawnfox/ly.ini
#
# ly keeps its whole config in one file. Copy the keys below into
# /etc/ly/config.ini, replacing the matching lines.

# Login box
fg = 0x00575279
bg = 0x00FAF4ED
border_fg = 0x00BDBFC9

# Errors (bold, matching ly's default styling)
error_fg = 0x01B4637A
error_bg = 0x00FAF4ED

# Background-animation colors (only used when `animation` is set)
cmatrix_fg = 0x00618774
cmatrix_head_col = 0x01629F81
gameoflife_fg = 0x00618774
colormix_col1 = 0x00286983
colormix_col2 = 0x00907AA9
colormix_col3 = 0x00EBE5DF
doom_top_color = 0x00B4637A
doom_middle_color = 0x00EA9D34
doom_bottom_color = 0x00E5E9F0
